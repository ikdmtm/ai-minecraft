name: Gameplay CI

on:
  push:
    branches: [revive/gameplay-first-jev]

permissions:
  contents: read

jobs:
  verify-and-integrate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/revive/gameplay-first-jev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact verified source and supplemental changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, lzma
          parts = sorted(Path('scripts/.autonomy-update').glob('part-*.b64'))
          if len(parts) != 4: raise SystemExit('Expected four update parts')
          raw = lzma.decompress(base64.b64decode(b''.join(p.read_bytes().strip() for p in parts), validate=True))
          if hashlib.sha256(raw).hexdigest() != '83bccfbbef4bd6606495d3729043627e2dfb6e004ecc3805f872e9d5d08825a3':
              raise SystemExit('Update checksum mismatch')
          extra = Path('scripts/.autonomy-update/supplement.json').read_bytes()
          if hashlib.sha256(extra).hexdigest() != '3e15eedd8b80a011c05d63c723ee195eb8ffa3b7f6a6385c810c83be4902c008':
              raise SystemExit('Supplement checksum mismatch')
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          prepared = {}
          for update in [json.loads(raw), json.loads(extra)]:
              seen = set()
              for entry in update['files']:
                  p = Path(entry['path'])
                  if p.is_absolute() or '..' in p.parts or p.is_symlink() or str(p) in seen:
                      raise SystemExit('Invalid update path')
                  if not (str(p).startswith(('src/gameplay/', 'docs/', 'scripts/')) or str(p) in {
                      'package.json', 'src/cognitive/tacticalLayer.test.ts', 'src/dashboard/server.test.ts', 'src/youtube/api.test.ts'
                  }): raise SystemExit('Path outside reviewed change')
                  seen.add(str(p))
                  previous = prepared.get(p, p.read_bytes() if p.exists() else None)
                  if (blob(previous) if previous is not None else None) != entry['before']:
                      raise SystemExit('Concurrent source change: ' + str(p))
                  text = (previous or b'').decode('utf8'); cursor = 0; chunks = []
                  for start, end, replacement in entry['edits']:
                      if not (cursor <= start <= end <= len(text)): raise SystemExit('Invalid offsets')
                      chunks.extend((text[cursor:start], replacement)); cursor = end
                  chunks.append(text[cursor:]); result = ''.join(chunks).encode('utf8')
                  if blob(result) != entry['after']: raise SystemExit('Result checksum mismatch: ' + str(p))
                  prepared[p] = result
          for p, content in prepared.items():
              p.parent.mkdir(parents=True, exist_ok=True); p.write_bytes(content)
          Path('/tmp/autonomy-changed-paths.txt').write_text('\n'.join(str(p) for p in prepared) + '\n')
          print('Applied and verified', len(prepared), 'source files')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run lint && npm run build
      - name: Full unit tests
        run: npm test
      - name: Vanilla specification export tests
        run: python3 scripts/test-export-knowledge.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Minecraft 1.21.4 disposable-world adapter smoke test
        env:
          MC_DEV_DIR: ${{ runner.temp }}/autonomy-smoke-server
        run: |
          bash scripts/mc-setup-local.sh
          timeout -k 10s 240s npm run test:gameplay-smoke
      - name: Retain smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomy-smoke-diagnostics
          path: data/autonomy-smoke-server.log
          retention-days: 3
          if-no-files-found: ignore
      - name: Publish only verified changes without overwriting concurrent work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" fetch origin "$GITHUB_REF_NAME" --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          while IFS= read -r file; do git add -- "$file"; done < /tmp/autonomy-changed-paths.txt
          git rm -r -- scripts/.autonomy-update
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete tested primitive autonomy and persistent evidence-based procedures'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
