name: Gameplay CI

on:
  push:
    branches: [revive/gameplay-first-jev]
  pull_request:
    branches: [revive/gameplay-first-jev]
  workflow_dispatch:

# CI verifies the checked-out source; it never rewrites or publishes it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  verify:
    name: Typecheck, build and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Full unit tests
        run: npm test
      - name: Vanilla specification export tests
        run: python3 scripts/test-export-knowledge.py
      - name: Verify tracked source is unchanged
        if: always()
        run: |
          git diff --exit-code
          git diff --cached --exit-code

  adapter-smoke:
    name: Minecraft 1.21.4 adapter smoke
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MC_VERSION: '1.21.4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Download fixture server
        env:
          # The download stays on the hosted runner, not the user's world.
          MC_DEV_DIR: ${{ runner.temp }}/autonomy-smoke-server
        run: bash scripts/mc-setup-local.sh
      - name: Disposable-world adapter smoke test (no LLM requests)
        env:
          MC_DEV_DIR: ${{ runner.temp }}/autonomy-smoke-server
        run: timeout -k 10s 240s npm run test:gameplay-smoke
      - name: Retain smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomy-smoke-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/autonomy-smoke-server.log
          retention-days: 3
          if-no-files-found: ignore
      - name: Verify tracked source is unchanged
        if: always()
        run: |
          git diff --exit-code
          git diff --cached --exit-code
